<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a24">
<meta name="robots" content="noindex,nofollow">
<title>Final Mission</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<main>
  <section id="intro" class="scene" hidden>
    <h1 class="title" tabindex="-1">FINAL MISSION UNLOCKED 💘</h1>
    <img class="cake fade-up" id="cake" alt="A glowing birthday cake with three candles" style="animation-delay:2.2s">
    <div class="row fade-up" style="animation-delay:4.2s"><button class="btn" id="open" type="button">Open the letter ✉️</button></div>
  </section>

  <section id="letterScene" class="scene" hidden>
    <p class="kicker">A LETTER, DELIVERED</p>
    <article class="letter" id="letter" aria-label="Birthday letter"></article>
    <div class="row fade-up" id="afterLetter" hidden><button class="btn" id="toEnd" type="button">One last scene →</button></div>
  </section>

  <section id="end" class="scene" hidden>
    <div class="end-art"><img id="endArt" alt="The two of you under a dreamy night sky"></div>
    <h2 tabindex="-1" class="sub" style="font-size:1.3rem">Same sky. Same us.</h2>
    <div class="row"><a class="btn" id="replayLink" href="../">Replay our little universe 💗</a></div>
  </section>
</main>
<script type="module" src="../js/final.js"></script>
</body>
</html>
