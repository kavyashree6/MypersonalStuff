<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" preserveAspectRatio="xMidYMid slice"><style>
.tw{animation:tw 3.2s ease-in-out infinite}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bl{animation:bl 5.5s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pet{animation:pet 9s linear infinite}
.pop{animation:pop 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fk{animation:fk .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sh{animation:sh 7s ease-in infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes sw{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes pet{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate(-60px,780px) rotate(300deg);opacity:.9}}
@keyframes pop{0%,100%{transform:scale(.85)}50%{transform:scale(1.15)}}
@keyframes fk{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
@keyframes sh{0%{transform:translate(0,0);opacity:0}4%{opacity:1}14%{transform:translate(-260px,150px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
